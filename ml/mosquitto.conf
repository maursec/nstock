# Mosquitto config for local NStock development.
#
#   mosquitto -c ml/mosquitto.conf -v
#
# Only accepts connections from this computer. To let teammates connect
# for a demo, change the listener line to "listener 1883" (all network
# interfaces). There's no password, so only do that on a trusted network.

listener 1883 127.0.0.1
allow_anonymous true
